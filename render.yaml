services:
  - type: web
    name: erp-backend
    runtime: node
    plan: free
    region: virginia
    rootDir: .
    buildCommand: npm install -g pnpm@11.17.0 && pnpm install --frozen-lockfile && pnpm --filter backend exec prisma generate && pnpm --filter backend build
    startCommand: cd backend && node node_modules/prisma/build/index.js migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
